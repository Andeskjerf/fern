[package]
name = "fern"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
dotenv = "0.15.0"
scaleway-rs = {version = "0.2.8", features = ["blocking"]}
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# image size: abort drops unwind tables from the appliance binary
[profile.release]
panic = "abort"
